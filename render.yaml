services:
  - type: web
    runtime: static
    name: finsight-personal-finance
    buildCommand: npm ci && npm ci --prefix client && npm --prefix client run build
    staticPublishPath: ./client/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        value: https://finsight-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
